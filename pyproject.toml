[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-playlist"
version = "0.1.0"
description = "Turn song recs from iMessage chats into Spotify playlists"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.8"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ttp = "text_to_playlist.cli:main"

[tool.setuptools]
packages = ["text_to_playlist"]
